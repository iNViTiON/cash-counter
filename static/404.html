<!doctype html>
<!--
  This file exists to stop Cloudflare Pages guessing.

  With no 404.html, Pages "assumes a single-page application deployment and
  matches all incoming paths to the root", serving index.html at status 200 for
  anything unmatched — including a hashed asset that has not finished
  propagating during a deploy. `_headers` marks /_app/immutable/* as
  `max-age=31536000, immutable`, so the edge then caches that HTML under the
  JavaScript URL for a year. `import()` gets HTML, rejects, and the app dies
  with SvelteKit's "500 Internal Error".

  That is not hypothetical: it happened in production twice, on two different
  chunks, and it recurs on every deploy because every deploy has that window.

  Emptying `_redirects` does NOT prevent it — the fallback is Pages' own
  behaviour, not a redirect rule. Only the presence of this file does.

  Keep it. Deleting it silently restores the SPA fallback and the outage.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0F0F10" />
		<title>Not found — EuroCash</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #0f0f10;
				color: #e8e4dc;
				font-family: Archivo, system-ui, -apple-system, sans-serif;
			}
			.wrap {
				height: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 18px;
				box-sizing: border-box;
			}
			.box {
				max-width: 380px;
				background: #17181b;
				border: 1px solid #23262a;
				border-radius: 12px;
				padding: 18px;
			}
			.code {
				font-family: 'JetBrains Mono', ui-monospace, monospace;
				font-size: 30px;
				font-weight: 700;
				color: #ffb020;
				line-height: 1;
			}
			.t {
				margin-top: 10px;
				font-size: 14px;
				font-weight: 700;
				letter-spacing: 0.04em;
			}
			.b {
				margin-top: 8px;
				font-size: 12px;
				line-height: 1.55;
				color: #8e9199;
			}
			a {
				display: inline-block;
				margin-top: 14px;
				padding: 11px 16px;
				border-radius: 9px;
				background: #ffb020;
				color: #141414;
				text-decoration: none;
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.1em;
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<div class="box">
				<div class="code">404</div>
				<div class="t">Nothing here</div>
				<div class="b">EuroCash lives at the root of this site.</div>
				<a href="/">OPEN EUROCASH</a>
			</div>
		</div>
	</body>
</html>
